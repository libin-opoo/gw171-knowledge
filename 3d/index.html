<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GW171 三维总览</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: #a9c1d8;
    /* 关键：禁止浏览器手势抢走 three.js 的触摸事件 */
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  /* 画布用固定定位铺满视口。不依赖百分比高度：
     WebView 里 body 的 height:100% 偶发解析为 0，会让 canvas 被压成零高。*/
  #stage {
    display: block;
    position: fixed;
    left: 0; top: 0;
    width: 100%; height: 100%;
  }

  /* 加载中 */
  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    font-family: -apple-system, "Noto Sans CJK SC", sans-serif;
    color: #1d3348; font-size: 15px;
    background: #a9c1d8;
    transition: opacity .35s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #7f9ab5; border-top-color: #1b5e9b;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 部件浮标（选中时显示的名称气泡） */
  #tag {
    position: absolute; left: 0; top: 0;
    padding: 7px 13px; border-radius: 9px;
    background: rgba(20, 40, 62, .90);
    color: #fff; font-size: 14px; font-weight: 600;
    font-family: -apple-system, "Noto Sans CJK SC", sans-serif;
    white-space: nowrap; pointer-events: none;
    transform: translate(-50%, -140%);
    opacity: 0; transition: opacity .18s ease;
    box-shadow: 0 3px 10px rgba(0,0,0,.28);
  }
  #tag.show { opacity: 1; }
  #tag small { display: block; font-weight: 400; font-size: 11px; opacity: .78; margin-top: 2px; }

  /* 右下角提示 */
  #hint {
    position: absolute; right: 12px; bottom: 12px;
    font-family: -apple-system, "Noto Sans CJK SC", sans-serif;
    font-size: 11px; color: #4a6480; opacity: .75;
    pointer-events: none; text-align: right; line-height: 1.5;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">正在加载三维模型…</div>
</div>
<div id="tag"></div>
<div id="hint">拖动旋转 · 双指缩放<br>点击部件查看资料</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="OrbitControls.js"></script>
<script src="RoomEnvironment.js"></script>
<!-- scene.js 必须带版本号：外罩/模型更新后，浏览器和 WebView 都可能缓存旧脚本 -->
<script src="scene.js?v=12"></script>
</body>
</html>
